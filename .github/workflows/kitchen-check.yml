name: Affiliate launch checks

# This workflow used to run kitchen-build/readiness.py and its unit tests. That
# checker validated a second edition of the site (kitchen/) whose generator and
# pages were set aside during the 2026-11-20 integration, so it failed on every
# push to main with ModuleNotFoundError: layout — a permanently red check next to
# a live URL, which tells a reviewer nothing. The checks below are the launch
# gate for the surface that actually publishes.
#
# The archived edition and its original test suite are preserved at
# _archive/2026-11-20-late-merges/ (see the README there for how to restore it).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Launch gate — disclosure, sponsored marking, price prohibition, registers
        run: python3 _tools/validate.py

      - name: Launch gate — paid-link unit tests (no synthesised tags, approved register only)
        run: cd tools && python3 -m unittest test_paid_link_gate -v

      - name: Launch gate — no second published surface has crept back in
        run: |
          python3 _tools/build.py
          python3 _tools/sweep_surfaces.py --dry-run --run-label probe | tee sweep.log
          grep -q '^would move: 0 ' sweep.log || {
            echo "::error::generated pages exist outside the single published pipeline"
            echo "Either add them to _tools/build.py, or move the competing surface to _archive/."
            exit 1
          }

      - name: First-party client and self-hosted collector still parse
        run: |
          python3 _tools/check_js.py assets/js/events.js assets/js/shortlist.js
          python3 -m py_compile _analytics/endpoint.py
          grep -q "localStorage" assets/js/shortlist.js && echo "shortlist stays local (localStorage, nothing transmitted)"
          if grep -rnE "googletagmanager|google-analytics|\bgtag\b|facebook|doubleclick|cloudflareinsights" --include=*.html --include=*.js . | grep -v '^./_archive/' ; then
            echo "::error:: third-party tracking found in the published tree"
            exit 1
          fi
          echo "no third-party tracker referenced outside _archive/" 
