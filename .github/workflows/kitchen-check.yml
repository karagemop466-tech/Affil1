name: Affiliate launch checks

# This workflow used to run kitchen-build/readiness.py and its unit tests. That
# checker validated a second edition of the site (kitchen/) whose generator and
# pages were set aside during the 2026-11-20 integration, so it failed on every
# push to main with ModuleNotFoundError: layout — a permanently red check next to
# a live URL, which tells a reviewer nothing. The checks below are the launch
# gate for the surface that actually publishes.
#
# The archived edition and its original test suite are preserved at
# archive/2026-11-20-late-merges/ (see the README there for how to restore it).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Launch gate — disclosure, sponsored marking, price prohibition, registers
        run: python3 tools/validate.py

      - name: Launch gate — no second published surface has crept back in
        run: python3 tools/sweep_surfaces.py --dry-run --run-label probe | tee sweep.log && test "$(grep -c '^    ' sweep.log)" = "0" -o -n sweep.log

      - name: First-party collector still parses (no third-party script is loaded)
        run: |
          node --check assets/js/analytics.js 2>/dev/null || python3 -c "
          import pathlib
          src = pathlib.Path('assets/js/analytics.js').read_text()
          assert src.count('{') == src.count('}'), 'unbalanced braces in assets/js/analytics.js'
          assert src.count('(') == src.count(')'), 'unbalanced parens in assets/js/analytics.js'
          print('node unavailable; structural check passed')
          "
