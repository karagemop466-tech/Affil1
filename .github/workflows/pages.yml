name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  for k,v in attrs:
                      if k in ('href','src') and v and not v.startswith(('http://','https://','#','mailto:','data:','javascript:')): self.links.append(v.split('#')[0])
          for page in [Path('index.html'), *Path('guides').glob('*.html')]:
              parser=Links(); parser.feed(page.read_text())
              for ref in parser.links:
                  target=(page.parent/ref).resolve()
                  if ref and not target.exists(): raise SystemExit(f'Broken local reference: {page}: {ref}')
          print('Local HTML references exist.')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
