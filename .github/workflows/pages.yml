name: Build, check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    outputs:
      source: ${{ steps.pages-source.outputs.source }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: python3 _tools/build.py

      - name: Verify every rule the site claims
        run: python3 _tools/check.py

      - name: Check relative links across served editions
        run: python3 _tools/check_local_links.py

      - name: Paid-link gate — a public observation must never create a tag
        run: python3 -m unittest discover -s _tools -p 'test_*.py' -v

      - name: Validate the internal Decision Desk section
        run: python3 _decision-support/validate.py

      - name: Validate the Countertop Almanac edition and platform
        run: python3 _platform/verify_edition.py

      # This step used to copy the tree, rebuild, and diff those two copies. The
      # build step above had already written into that tree, so the check compared
      # build output with build output: it could only ever catch a non-deterministic
      # generator, never a page that was edited by hand or left stale in a merge --
      # and on a legacy-configuration Pages site, the committed file is what readers
      # get. It was passing while a guide with a duplicated source block sat
      # hand-trimmed in the tree (FLG-052). Diff against HEAD instead, then rebuild
      # to catch non-determinism as well.
      - name: Confirm the committed edition is the build's own output
        run: |
          if ! git diff --quiet HEAD -- . ; then
            echo "::error::_tools/build.py does not reproduce the committed pages. Commit the regenerated output or fix the generator; generated HTML must not be edited by hand."
            git status --short
            git diff --stat HEAD -- .
            exit 1
          fi
          python3 _tools/build.py
          if ! git diff --quiet -- . ; then
            echo "::error::The second build differed from the first: the generator is not deterministic."
            git status --short
            exit 1
          fi

      - name: Stage the public edition
        run: python3 _tools/stage.py _site

      - name: Read the configured Pages source
        id: pages-source
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
        if: steps.pages-source.outputs.source == 'workflow'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-source.outputs.source == 'workflow'
        with:
          path: _site

  deploy:
    if: needs.build.outputs.source == 'workflow'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
