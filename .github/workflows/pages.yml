name: Build, check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: python3 tools/build.py

      - name: Verify every rule the site claims
        run: python3 tools/check.py

      - name: Confirm the build is reproducible, not hand-edited
        run: |
          cp -r . /tmp/first-build
          python3 tools/build.py
          if ! diff -r -q --exclude='.git' --exclude='__pycache__' /tmp/first-build . ; then
            echo "::error::Output is not reproducible. Files were changed by hand rather than by the build."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
