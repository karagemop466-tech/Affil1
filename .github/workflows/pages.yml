name: Build, check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    outputs:
      source: ${{ steps.pages-source.outputs.source }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site
        run: python3 _tools/build.py

      - name: Verify every rule the site claims
        run: python3 _tools/check.py

      - name: Check relative links across served editions
        run: python3 _tools/check_local_links.py

      - name: Paid-link gate — a public observation must never create a tag
        run: python3 -m unittest discover -s _tools -p 'test_*.py' -v

      - name: Validate the internal Decision Desk section
        run: python3 _decision-support/validate.py

      # These suites have existed in the repository without ever running in CI.
      # Both were red when run from the repository root on 2026-11-20, because the
      # modules they import sit beside them and nothing put that directory on the
      # path. They now run from their own directory, which is how they pass, and a
      # red check here is a real regression rather than a path artefact.
      - name: First-party collector tests (_analytics/)
        working-directory: _analytics
        run: python3 -m unittest -v test_endpoint

      - name: Self-hosted aggregate collector tests (_measurement/)
        working-directory: _measurement
        run: python3 -m unittest -v test_collector

      - name: Fit finder behaviour
        run: node _tools/fit.test.cjs

      - name: Confirm the build is reproducible, not hand-edited
        run: |
          cp -r . /tmp/first-build
          python3 _tools/build.py
          if ! diff -r -q --exclude='.git' --exclude='__pycache__' /tmp/first-build . ; then
            echo "::error::Output is not reproducible. Files were changed by hand rather than by the build."
            exit 1
          fi

      - name: Stage the public edition
        run: python3 _tools/stage.py _site

      - name: Read the configured Pages source
        id: pages-source
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
        if: steps.pages-source.outputs.source == 'workflow'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-source.outputs.source == 'workflow'
        with:
          path: _site

  deploy:
    if: needs.build.outputs.source == 'workflow'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
