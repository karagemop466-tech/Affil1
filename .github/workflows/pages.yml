name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Render the site from the single source of truth
        run: python3 scripts/build_site.py

      - name: Fail if the committed pages have drifted from the renderer
        run: |
          if ! git diff --exit-code --stat -- '*.html' '*.xml' '*.txt' '.nojekyll'; then
            echo "::error::The committed pages do not match site_data.py. Run scripts/build_site.py and commit the result."
            git diff --stat -- '*.html' '*.xml' '*.txt' '.nojekyll'
            exit 1
          fi

      - name: Publishing gate
        run: python3 scripts/check_site.py

      - name: Stage only the published files
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html 404.html robots.txt sitemap.xml feed.xml styles.css app.js .nojekyll _site/
          cp -r assets guides shop desk _site/
          echo "Staged:" && find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
