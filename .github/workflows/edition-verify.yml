name: Verify Countertop Almanac edition and platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run data-layer compliance gate
        run: python3 _platform/compliance_gate.py

      - name: Rebuild edition deterministically
        run: python3 _platform/build_edition.py

      - name: Run line-by-line HTML, source-link, anchor & policy verifier
        run: python3 _platform/verify_edition.py

      - name: Confirm edition build is reproducible (zero drift)
        run: |
          cp -r edition /tmp/edition-snapshot
          python3 _platform/build_edition.py
          diff -r -q /tmp/edition-snapshot edition

      - name: Check client JavaScript syntax
        run: |
          node --check edition/assets/analytics.js
          node --check edition/assets/app.js

      # The directory was underscore-prefixed when working files were hidden from
      # legacy Pages, but this step still said `-s platform`. unittest resolved
      # that to CPython's *stdlib* platform package and reported 45 passing tests
      # from test.test_support while running none of _platform's own. Pinned to
      # the real directory, with an explicit discovery check so a name that
      # resolves to nothing can never look green again.
      - name: Run platform unit & HTTP collector tests
        run: |
          python3 -m unittest discover -s _platform -p 'test_*.py' -v 2>&1 | tee platform-tests.log
          grep -q '^OK' platform-tests.log || { echo "::error::.github/workflows/edition-verify.yml reports no passing run"; exit 1; }
          grep -qE '^Ran [1-9][0-9]* tests?( in|$)' platform-tests.log || {
            echo "::error::no tests were discovered in _platform — the step is not testing the platform"
            exit 1
          }
