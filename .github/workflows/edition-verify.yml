name: Verify Countertop Almanac edition and platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run data-layer compliance gate
        run: python3 _platform/compliance_gate.py

      - name: Rebuild edition deterministically
        run: python3 _platform/build_edition.py

      - name: Run line-by-line HTML, source-link, anchor & policy verifier
        run: python3 _platform/verify_edition.py

      - name: Confirm edition build is reproducible (zero drift)
        run: |
          cp -r edition /tmp/edition-snapshot
          python3 _platform/build_edition.py
          diff -r -q /tmp/edition-snapshot edition

      - name: Check client JavaScript syntax
        run: |
          node --check edition/assets/analytics.js
          node --check edition/assets/app.js

      - name: Run platform unit & HTTP collector tests
        # This pointed at `platform`, a directory that has not existed since the
        # rename to `_platform`. `unittest discover` did not fail: it resolved the
        # name to the standard-library `platform` module, took its parent directory,
        # and ran 45 of CPython's own test-support tests -- green, and nothing to do
        # with this repository. The step passed while verifying nothing. The path is
        # `_platform` now, which is where test_platform.py actually lives.
        run: python3 -m unittest discover -s _platform -p 'test_*.py' -v
