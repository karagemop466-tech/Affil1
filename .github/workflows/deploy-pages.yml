name: Build, gate and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight; let it finish, queue the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and run the compliance gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the site
        run: node scripts/build.mjs

      - name: Run the compliance gate
        # Fails the job on any disclosure, sponsored-link, price, rating,
        # hands-on-claim, broken-link or sitemap violation.
        run: node scripts/check.mjs

      - name: Prove the gate catches deliberate violations
        run: node scripts/test-gate.mjs

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
