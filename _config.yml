# GitHub Pages serves this branch root in legacy mode with a root .nojekyll, so
# Jekyll never runs and no exclude here takes effect. What actually keeps the
# working papers off the public host is the underscore rename: Pages publishes
# nothing whose path segment starts with "_", so _decision-support/, _src/,
# _data/, _tools/, _analytics/, _server/ and _archive/ are not reachable, while
# the built shop at the root is. See PUBLISHING_WORKFLOW.md for the check that
# proves each one returns 404. This list is retained for a Jekyll-mode fallback.
plugins: []
exclude:
  - COORDINATION.md
  - EXECUTIVE_SUMMARY.md
  - LICENSE
  - PUBLISHING_WORKFLOW.md
  - README.md
  - analytics
  - archive
  - dashboard
  - dist
  - docs
  - flagged
  - guides/air-fryer-capacity-checklist/index.html
  - guides/air-fryer-thanksgiving-overflow/index.html
  - guides/basket-or-oven-air-fryer/index.html
  - guides/cleanup-and-counter-space/index.html
  - guides/dual-basket-math/index.html
  - guides/first-week-checklist/index.html
  - guides/frozen-food-nights/index.html
  - guides/multi-function-kitchen-appliance-questions/index.html
  - guides/smart-probe-thermometer/index.html
  - kitchen
  - kitchen-build
  - legacy
  - measurement
  - node_modules
  - server
  - src
  - tools
  - topics
  - vendor
