# GitHub Pages configuration for the canonical publication.
#
# Two builds can serve this repository: Jekyll over the branch (build_type
# legacy, what is configured today) and the upload from tools/stage.py
# (build_type workflow). Both must publish the same set of files.
#
# The exclude list below is generated from tools/publish.py, which is the single
# allow-list both routes read. Do not hand-edit it; run
#
#     python3 tools/publish.py --write-config
#
# and commit the result. Left to itself, Jekyll published the whole repository:
# /src/data/products.json, /tools/build.py and a second storefront under
# /archive/ were all reachable on 2026-11-20 (FLG-026).
plugins: []
exclude:
  - .github
  - .gitignore
  - COORDINATION
  - COORDINATION.md
  - EXECUTIVE_SUMMARY.md
  - LICENSE
  - PUBLISHING_WORKFLOW.md
  - README.md
  - _config.yml
  - analytics
  - archive
  - data
  - decision-support
  - docs
  - measurement
  - server
  - src
  - tools
